# Why not plain /usr/bin/waybar: this host keeps per-compositor configs
# (config-hyprland / config-niri), so there is no ~/.config/waybar/config for
# waybar to find. launch.sh picks one from HYPRLAND_INSTANCE_SIGNATURE /
# NIRI_SOCKET, both of which the session imports into the systemd user manager.
[Service]
ExecStart=
ExecStart=%h/.config/waybar/scripts/launch.sh
